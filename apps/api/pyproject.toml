[project]
name = "aavedak-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.118.0",
  "python-dotenv>=1.1.1",
  "pydantic-settings>=2.11.0",
  "psycopg[binary]>=3.2.0",
  "httpx>=0.28.0",
]

# Local only (not deployed): dev server + tests. `pip install -r requirements-dev.txt`.
[dependency-groups]
dev = ["uvicorn[standard]>=0.37.0", "pytest>=8.4.0"]

[tool.vercel]
entrypoint = "main:app"
